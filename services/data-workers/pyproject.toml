[project]
name = "plated-data-workers"
version = "0.0.0"
description = "Plated data plane: ingestion, extraction, canonicalisation, freshness, review-queue workers (PDF section 6)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "arq>=0.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "redis>=5.2.0",
    "sentence-transformers>=3.2.0",
    "rapidfuzz>=3.10.0",
    "openai>=1.50.0",
    "pymupdf>=1.24.0",
    "aioboto3>=13.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "datamodel-code-generator>=0.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# asyncpg and sentence-transformers ship no py.typed marker / usable stubs;
# without this every asyncpg.* and SentenceTransformer.* call site would
# need its own ignore comment.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "sentence_transformers.*", "pgvector.*", "aioboto3.*", "pymupdf.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tasks*", "schemas*", "scripts*"]
