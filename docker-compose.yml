services:
  postgres:
    build: ./infra/postgres
    container_name: plated-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plated}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plated_dev}
      POSTGRES_DB: ${POSTGRES_DB:-plated}
    ports:
      - "5432:5432"
    volumes:
      - plated_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plated}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: plated-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - plated_opensearch_data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    container_name: plated-redis
    ports:
      - "6379:6379"
    volumes:
      - plated_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: plated-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-plated}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-plated_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - plated_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: plated-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-plated}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-plated_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-plated-artefacts}
    volumes:
      - ./infra/minio/init-bucket.sh:/init-bucket.sh:ro

volumes:
  plated_postgres_data:
  plated_opensearch_data:
  plated_redis_data:
  plated_minio_data:
